# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: perplexity-browser

builds:
  - id: perplexity-browser-mcp
    main: ./cmd/perplexity-browser-mcp
    binary: perplexity-browser-mcp
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  abbrev: -1

release:
  name_template: "v{{.Version}}"
