# Go quality + GitLab security templates.
stages:
  - quality
  - test
  - secret-detection

variables:
  GO_VERSION: "1.24"
  SECRET_DETECTION_ENABLED: "true"

default:
  interruptible: true

include:
  - local: .gitlab/ci/golang-quality.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

sast:
  stage: test

secret_detection:
  stage: secret-detection
